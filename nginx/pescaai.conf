# Configuración Nginx para Pesca AI (Soporte HTTP/HTTPS, PWA y WebSockets 24/7)
# Ruta en servidor: /etc/nginx/sites-available/pescaai.conf -> /etc/nginx/sites-enabled/

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pescaai.weblifetech.com pesca.weblifetech.com;

    # Tamaño máximo de carga para audios largos de pesaje
    client_max_body_size 64M;

    # Logs
    access_log /var/log/nginx/pescaai.access.log;
    error_log /var/log/nginx/pescaai.error.log;

    # Compresión Gzip para PWA y assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # API REST y Frontend PWA
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket Realtime de Voz de Planta 24/7 (/ws/voice)
    location /ws/voice {
        proxy_pass http://127.0.0.1:4000/ws/voice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive para llamadas manos libres continuas
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # PWA Service Worker & Manifest Caching
    location ~* \.(?:manifest|webmanifest|json)$ {
        proxy_pass http://127.0.0.1:4000;
        add_header Cache-Control "no-cache";
        expires 0;
    }
}
